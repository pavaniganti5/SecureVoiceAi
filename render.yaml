services:
  - type: web
    name: securevoice-api
    runtime: python
    rootDir: backend
    plan: standard
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: securevoice
      - key: MURF_API_KEY
        sync: false
      - key: MURF_VOICE_ID
        value: en-US-natalie
      - key: FRONTEND_ORIGIN
        sync: false
